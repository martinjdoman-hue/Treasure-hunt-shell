<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Find the Buried Bell Shell</title>

<style>
body {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  background: #f2e4c4;
  color: #3b2a1a;
}
header {
  text-align: center;
  background: #d2b48c;
  border-bottom: 6px solid #7a4a1d;
  padding: 30px;
}
header img {
  max-width: 180px;
  margin-bottom: 10px;
}
h1 {
  font-size: 44px;
  letter-spacing: 2px;
  margin: 10px 0;
}
.container {
  max-width: 900px;
  margin: 40px auto;
  background: #fff8dc;
  border: 5px solid #7a4a1d;
  box-shadow: 0 0 20px rgba(0,0,0,0.35);
  padding: 40px;
}
.message {
  text-align: center;
  font-size: 28px;
  letter-spacing: 6px;
  margin-bottom: 20px;
  font-weight: bold;
}
.progress {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}
.progress div {
  width: 6%;
  height: 16px;
  background: #cbb68e;
  border: 1px solid #7a4a1d;
}
.progress .done {
  background: #7a4a1d;
}
.timer {
  text-align: center;
  font-size: 18px;
  margin-bottom: 20px;
}
.problem {
  font-size: 18px;
}
button {
  background: #7a4a1d;
  color: white;
  border: none;
  padding: 10px 20px;
  font-size: 18px;
  cursor: pointer;
  font-weight: bold;
}
button:hover {
  background: #5c3514;
}
#quiz { display: none; }
#splash {
  text-align: center;
  padding: 80px 20px;
}
</style>
</head>

<body>

<header>
  <img src="bell.png" alt="Bell Shell">
  <h1>Find the Buried Bell Shell</h1>
</header>

<div class="container">

<div id="splash">
<p><strong>Legend tells of a bell shell buried long ago.</strong></p>
<p>Solve the mathematical trials to reveal where it lies.</p>
<button onclick="startGame()">START</button>
</div>

<div id="quiz">
<div class="timer">
Time Remaining: <span id="time">30:00</span>
</div>

<div class="message" id="message">
_ _ _ &nbsp; _ _ &nbsp; _ _ _ &nbsp; _ _ _ _ _ _
</div>

<div class="progress" id="progress"></div>
<div class="problem" id="problem"></div>
</div>

</div>

<script>
const messageText = "DIG AT THE CORNER";
let revealed = Array.from(messageText).map(c => c === " " ? " " : "_");

let current = 0;
let seconds = 1800;
let timerStarted = false;

const problems = [
 "Solve: 4x = 28",
 "Solve: x^2 = 49 (positive solution)",
 "Evaluate: 3(5 + 2)",
 "Solve: 2^x = 32",
 "Find the hypotenuse of a triangle with legs 6 and 8",
 "What is 5! (factorial)?",
 "Solve: |3x − 9| = 0",
 "If sin(x) = 1/2, what is x in degrees?",
 "Derivative: if f(x)=x^3, find f'(2)",
 "Evaluate: integral from 0 to 2 of 2x dx",
 "Find the 6th term: a_n = n^2",
 "Solve: log10(x) = 3",
 "If f(x)=2x^2−3x, find f(4)",
 "How many solutions does x^2−5x+6=0 have?"
];

const answers = [
 "7","7","21","5","10","120","3","30",
 "12","4","36","1000","20","2"
];

const progressDiv = document.getElementById("progress");
for (let i = 0; i < problems.length; i++) {
  progressDiv.appendChild(document.createElement("div"));
}

function updateMessage() {
  document.getElementById("message").innerText = revealed.join(" ");
}

function showProblem() {
  const p = document.getElementById("problem");
  p.innerHTML =
    "<p><strong>Problem " + (current + 1) + ":</strong> " + problems[current] + "</p>" +
    "<input id='answer'><br><br>" +
    "<button onclick='checkAnswer()'>Submit</button> <span id='feedback'></span>";
}

function checkAnswer() {
  const input = document.getElementById("answer").value.replace(/\s+/g, "");

  if (input === answers[current]) {
    revealed[current] = messageText[current];
    updateMessage();
    progressDiv.children[current].className = "done";
    current++;

    if (current === problems.length) {
      alert("☠️ The map is complete. DIG AT THE CORNER!");
      return;
    }

    showProblem();
  } else {
    document.getElementById("feedback").innerText = " Try again.";
  }
}

function startGame() {
  document.getElementById("splash").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  showProblem();

  if (!timerStarted) {
    timerStarted = true;
    setInterval(() => {
      if (seconds <= 0) return;
      seconds--;
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      document.getElementById("time").innerText =
        m + ":" + (s < 10 ? "0" : "") + s;
    }, 1000);
  }
}

updateMessage();
</script>

</body>
</html>
